<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>mocktail</title>
		<meta
			name="description"
			content="Deterministic test data that passes real validators."
		/>
		<script>
			try {
				const stored = localStorage.getItem("mocktail-theme");
				const dark =
					stored === "dark" ||
					(stored === null &&
						matchMedia("(prefers-color-scheme: dark)").matches);
				if (dark) document.documentElement.classList.add("dark");
			} catch {}
		</script>
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Poppins:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body
		class="bg-white font-sans text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100"
	>
		<main id="app" class="mx-auto w-full max-w-5xl px-6 pt-12 pb-32"></main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
